<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#4F8671"/>

  <!-- Drawing/Blueprint icon -->
  <!-- Outer rectangle representing a drawing sheet -->
  <rect x="7" y="8" width="18" height="16" rx="1.5" fill="none" stroke="white" stroke-width="1.5"/>

  <!-- Grid lines (planning drawing style) -->
  <line x1="11" y1="8" x2="11" y2="24" stroke="white" stroke-width="0.5" opacity="0.4"/>
  <line x1="16" y1="8" x2="16" y2="24" stroke="white" stroke-width="0.5" opacity="0.4"/>
  <line x1="21" y1="8" x2="21" y2="24" stroke="white" stroke-width="0.5" opacity="0.4"/>

  <line x1="7" y1="12" x2="25" y2="12" stroke="white" stroke-width="0.5" opacity="0.4"/>
  <line x1="7" y1="16" x2="25" y2="16" stroke="white" stroke-width="0.5" opacity="0.4"/>
  <line x1="7" y1="20" x2="25" y2="20" stroke="white" stroke-width="0.5" opacity="0.4"/>

  <!-- Check mark overlay (validation symbol) -->
  <path d="M 11 16 L 14 19 L 21 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
