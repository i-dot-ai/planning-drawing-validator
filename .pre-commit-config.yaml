# Pre-commit hooks for code quality and security
# Install: pre-commit install
# Run manually: pre-commit run --all-files
#
# IMPORTANT: Keep versions in sync with .github/workflows/code-quality.yml

repos:
  # Code formatting with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --config, ruff.toml]
      - id: ruff-format

  # Type checking
  # NOTE: Mypy currently disabled in pre-commit due to existing type errors that need fixing
  # Run manually with: mypy --ignore-missing-imports evaluation-app/ planning-drawing-validator/
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.13.0
  #   hooks:
  #     - id: mypy
  #       additional_dependencies:
  #         - types-requests
  #         - sqlalchemy[mypy]
  #         - types-pyyaml
  #       args: [--ignore-missing-imports, --explicit-package-bases, --namespace-packages]
  #       exclude: ^demo-app/

  # Security - Secret detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  # Security - Vulnerability scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.2
    hooks:
      - id: bandit
        args: ['-r', 'demo-app/', 'evaluation-app/', 'planning-drawing-validator/', '-ll', '--exclude', '*/.venv/*,*/tests/*,*/node_modules/*']
        pass_filenames: false

  # General quality checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: debug-statements
      - id: mixed-line-ending

  # Python-specific checks
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py312-plus]
