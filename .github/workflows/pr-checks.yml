name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title-check:
    name: PR Title Check
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
          requireScope: false
        continue-on-error: true

  pr-size-check:
    name: PR Size Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          LINES_CHANGED=$(git diff --shortstat origin/${{ github.base_ref }}...HEAD | grep -oE '[0-9]+ insertions|[0-9]+ deletions' | awk '{sum+=$1} END {print sum}')
          echo "Lines changed: $LINES_CHANGED"

          if [ "$LINES_CHANGED" -gt 1000 ]; then
            echo "⚠️ Large PR detected ($LINES_CHANGED lines changed)"
            echo "Consider splitting into smaller PRs for easier review"
          fi

  auto-assign-reviewers:
    name: Auto-assign Reviewers
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'

    steps:
      - name: Auto-assign reviewers
        uses: kentaro-m/auto-assign-action@v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  labeler:
    name: Auto-label PR
    runs-on: ubuntu-latest
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/labeler@v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  comment-on-first-pr:
    name: Welcome First-time Contributors
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'

    steps:
      - name: Check if first-time contributor
        uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            👋 Thanks for opening your first pull request! We're excited to review your contribution.

            A few things to keep in mind:
            - Make sure all CI checks pass
            - Update documentation if needed
            - Follow the coding style guidelines

            A maintainer will review your PR soon. Feel free to ask questions in the comments!

  check-breaking-changes:
    name: Check for Breaking Changes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for potential breaking changes
        run: |
          echo "Checking for potential breaking changes..."

          # Check if public API signatures changed
          git diff origin/${{ github.base_ref }}...HEAD -- '*.py' | grep -E "^[-+].*def.*\(" | grep -v "^\+" | grep "^-" || true

          # Check if configuration changed
          git diff origin/${{ github.base_ref }}...HEAD -- '*config*.py' '*settings*.py' '.env.example' || true

          echo "Review the changes above to ensure they don't break existing functionality"
        continue-on-error: true
