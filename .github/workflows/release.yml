name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0, v0.1.2

permissions:
  contents: write  # For creating releases

jobs:
  build-and-publish:
    name: Build and Publish Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install UV
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build core package
        run: |
          cd planning-drawing-validator
          uv pip install build
          python -m build

      - name: Verify build artifacts
        run: |
          ls -lh planning-drawing-validator/dist/
          echo "Built packages:"
          ls planning-drawing-validator/dist/

      - name: Publish to Test PyPI (manual trigger required)
        if: github.event_name == 'workflow_dispatch'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          uv pip install twine
          python -m twine upload --repository testpypi planning-drawing-validator/dist/*
        continue-on-error: true

      - name: Publish to PyPI (on release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv pip install twine
          python -m twine upload planning-drawing-validator/dist/*
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            planning-drawing-validator/dist/*.tar.gz
            planning-drawing-validator/dist/*.whl
          body: |
            ## Release ${{ steps.get_version.outputs.VERSION }}

            ### Installation

            ```bash
            pip install planning-drawing-validator==${{ steps.get_version.outputs.VERSION }}
            ```

            ### Documentation

            - [README](https://github.com/${{ github.repository }}/blob/v${{ steps.get_version.outputs.VERSION }}/README.md)
            - [Core Package Docs](https://github.com/${{ github.repository }}/blob/v${{ steps.get_version.outputs.VERSION }}/planning-drawing-validator/README.md)

          draft: false
          prerelease: false
